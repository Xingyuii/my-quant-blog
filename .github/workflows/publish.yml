on:
  push:
    branches: main

name: Publish Quarto Website (Manual Install)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: "gh-pages"
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install numpy matplotlib

      - name: Download and Install Quarto CLI
        run: |
          wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.4.554/quarto-1.4.554-linux-amd64.deb
          sudo dpkg -i quarto-1.4.554-linux-amd64.deb

      # --- 新增步骤：设置 Git 作者信息 ---
      - name: Set Git Config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      # --- 新增步骤结束 ---

      - name: Render and Publish Website
        run: |
          quarto publish gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}