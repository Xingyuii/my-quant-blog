on:
  # 当您推送到 main 分支时触发
  push:
    branches: main

name: Publish Quarto Website

jobs:
  publish:
    runs-on: ubuntu-latest
    # 允许 Action 写入您的 gh-pages 分支
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-cli-action@v2

      # --- 这是为您的 Python 代码添加的 ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 您可以选择 3.9, 3.10, 3.11 等

      - name: Install Python Dependencies
        run: |
          pip install numpy matplotlib
      # --- Python 部分结束 ---

      - name: Render and Publish Website
        # 使用 Quarto 自己的发布动作
        uses: quarto-dev/quarto-cli-action@v2
        with:
          command: publish gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}